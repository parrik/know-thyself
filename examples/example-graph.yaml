# ──────────────────────────────────────────────────────────────────────────────
#  THEMES — cross-time organizing packets (Schank TOP). A theme does not
#  generalize (that's what overlaps do); it binds ≥3 instances across
#  different periods and says: these are one long-running thread.
# ──────────────────────────────────────────────────────────────────────────────

- id: T-01-running-as-anchor-practice
  type: theme
  name: "Running as anchor practice — one thread across three periods"
  statement: |
    The same shape recurs in three otherwise-unrelated containers:
    high-school cross-country (L-01, O07), the daily runs of the
    previous-city years (L-02, O06), and the Sunday running group
    (L-03, O02). In each, a fixed physical practice carries load that
    nothing else in the period carries. This is not the generalization
    P01 makes by induction (routine is load-bearing); the theme binds
    the constellation — that the same practice re-forms in every
    chapter of the life says something earlier than any one instance.
    The recognition is the point; do not extract an implication.
  members:
    - O07-cross-country-in-school
    - O06-daily-runs-previous-city
    - O02-running-group
  said_by: "Surfaced May 2025 in a graph-review conversation"
  said_when: "2025-05"
  evidence_kind: pattern-across-cases
  evidence_notes: "Theme recognized across lifetime periods, not derived by induction"
  evidence_refs:
    - O07-cross-country-in-school
    - O06-daily-runs-previous-city
    - O02-running-group
  derives_from:
    - L-01-small-town-childhood
    - L-02-publishing-years-previous-city
    - L-03-new-city
  how_it_follows: "thematic recognition across periods (Schank TOP)"